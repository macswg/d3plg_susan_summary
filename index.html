<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Susan Summary</title>
  <style>
    :root {
      --bg: #1b1d21;
      --panel: #24272c;
      --line: #34383f;
      --text: #e6e8ea;
      --muted: #9aa0a8;
      --accent: #4c8dff;
      --ok: #43b581;
      --err: #e0574c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    button, input {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 14px;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    #status { min-height: 22px; margin-bottom: 14px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #status.busy { color: var(--muted); }
    .summary { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
    .summary div { color: var(--muted); }
    .summary b { color: var(--text); font-weight: 600; }
    #tracks { display: flex; flex-direction: column; gap: 10px; }
    details {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
    }
    summary { cursor: pointer; font-weight: 600; }
    summary .count { color: var(--muted); font-weight: 400; margin-left: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    td.muted, .path { color: var(--muted); }
    .path { font-size: 12px; word-break: break-all; }
    .disabled-layer td:first-child::after {
      content: "render off";
      margin-left: 8px;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <h1>Susan Summary</h1>
  <p class="sub">Snapshot every track, layer, media and time in the active setlist.</p>

  <div class="controls">
    <button id="capture" class="primary">Capture snapshot</button>
    <input id="transport" placeholder="Transport (blank = active)" size="26" />
    <button id="download" disabled>Download JSON</button>
  </div>

  <div id="status"></div>
  <div class="summary" id="summary" hidden></div>
  <div id="tracks"></div>

  <script type="module" src="./index.js"></script>
</body>
</html>
