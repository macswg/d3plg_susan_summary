<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Susan Summary</title>
  <link rel="icon" href="./icon.svg" />
  <style>
    :root {
      --bg: #1b1d21;
      --panel: #24272c;
      --line: #34383f;
      --text: #e6e8ea;
      --muted: #9aa0a8;
      --accent: #4c8dff;
      --ok: #43b581;
      --err: #e0574c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    kbd {
      font: 11px/1.6 ui-monospace, Consolas, monospace;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
    }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    label { color: var(--muted); }
    button, input, select {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 14px;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    #status { min-height: 22px; margin-bottom: 14px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    #status.busy { color: var(--muted); }
    .summary { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 14px; }
    .summary div { color: var(--muted); }
    .summary b { color: var(--text); font-weight: 600; }
    #tracks { display: flex; flex-direction: column; gap: 10px; }
    #tracks > div { display: flex; flex-direction: column; gap: 10px; }
    .transport-heading {
      font-size: 14px;
      font-weight: 600;
      margin: 8px 0 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }
    .transport-heading span { color: var(--muted); font-weight: 400; }
    details {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
    }
    summary { cursor: pointer; font-weight: 600; }
    summary .count { color: var(--muted); font-weight: 400; margin-left: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    td.muted, .path { color: var(--muted); }
    .cues { margin-top: 10px; padding: 8px 10px; background: var(--bg); border-radius: 6px; }
    .cues table { margin-top: 0; }
    .cues td { font-size: 12px; }
    .cues td.note { color: var(--accent); }
    .path { font-size: 12px; word-break: break-all; }
    #footer {
      margin-top: 28px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }
    .disabled-layer td:first-child::after {
      content: "render off";
      margin-left: 8px;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <h1>Susan Summary</h1>
  <p class="sub">
    Snapshot every track, layer, media and time in the showfile's setlists.
    Press <kbd>f</kbd> to expand or collapse all tracks.
  </p>

  <div class="controls">
    <button id="capture" class="primary">Capture Snapshot to logs</button>
    <label for="transport">Transport</label>
    <select id="transport">
      <option value="">Active transport</option>
    </select>
    <button id="refresh" title="Re-query the available transports">↻</button>
  </div>

  <div id="status"></div>
  <div class="summary" id="summary" hidden></div>
  <div id="tracks"></div>

  <footer id="footer">
    <div id="version"></div>
    <div>Sean Green</div>
  </footer>

  <script type="module" src="./index.js"></script>
</body>
</html>
